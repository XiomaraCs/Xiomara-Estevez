<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velo Bytes | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-white flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md">
        <div class="mb-8"> 
          <h1 class="text-3xl font-bold tracking-tighter">
              Velo <span class="text-yellow-600">Bytes</span>
          </h1>
        </div>

        <h2 class="text-2xl font-medium mb-6">Welcome Back</h2>

        <form class="space-y-4">
            <div>
                <input 
                    type="email" 
                    placeholder="Enter email or mobile number" 
                    class="w-full bg-gray-100 border-none rounded-sm p-4 text-lg focus:ring-2 focus:ring-black outline-none transition"
                    required
                >
            </div>

            <div>
                <input 
                    type="password" 
                    placeholder="Password" 
                    class="w-full bg-gray-100 border-none rounded-sm p-4 text-lg focus:ring-2 focus:ring-black outline-none transition"
                    required
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-black text-white font-bold py-4 rounded-sm hover:bg-zinc-800 transition text-lg mt-4"
            >
                Next
            </button>
        </form>

        <div class="flex items-center my-8">
            <hr class="flex-grow border-gray-300">
            <span class="px-3 text-gray-500 text-sm">or</span>
            <hr class="flex-grow border-gray-300">
        </div>

        <div class="space-y-3">
            <!--Updated google button firebase -->
            <button 
                type="button" 
                onclick="loginWithGoogle()" 
                class="w-full flex items-center justify-center border border-gray-300 py-3 rounded-sm hover:bg-gray-50 transition"
            >
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-3" alt="Google">
                Continue with Google
            </button>
            <!--<button class="w-full flex items-center justify-center border border-gray-300 py-3 rounded-sm hover:bg-gray-50 transition">-->
                <!--<img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" class="w-5 h-5 mr-3" alt="Apple">-->
                <!--Continue with Apple-->
            <!--</button>-->
        </div>

        <p class="mt-8 text-sm text-gray-600">
            New to Velo <span class="text-yellow-600">Bytes</span>? <a href="signup.html" class="text-yellow-600 font-medium hover:underline transition">Create an account</a>
        </p>
    </div>

    <script type="module">
    // Use these specific versions to ensure the popup works on mobile/GitHub
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        // ... your config here ...
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Make sure 'window.' is used so the HTML button can find it!
    window.loginWithGoogle = async () => {
        try {
            const result = await signInWithPopup(auth, provider);
            alert("Success! Account linked for: " + result.user.displayName);
        } catch (error) {
            console.error(error);
            alert("Error: " + error.message);
        }
    };
</script>
</body>
</html>
