<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velo Bytes | Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-white flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md">
        <div class="mb-8"> 
          <h1 class="text-3xl font-bold tracking-tighter">
              Velo <span class="text-yellow-600">Bytes</span>
          </h1>
        </div>

        <h2 class="text-2xl font-medium mb-6">Create Account</h2>

        <form class="space-y-4">
            <div>
                <input 
                    id="signup-name"
                    type="text" 
                    placeholder="Full Name" 
                    class="w-full bg-gray-100 border-none rounded-sm p-4 text-lg focus:ring-2 focus:ring-black outline-none transition"
                    required
                >
            </div>

            <div>
                <input 
                    id="signup-email"
                    type="email" 
                    placeholder="Email address" 
                    class="w-full bg-gray-100 border-none rounded-sm p-4 text-lg focus:ring-2 focus:ring-black outline-none transition"
                    required
                >
            </div>

            <div>
                <input 
                    id="signup-password"
                    type="password" 
                    placeholder="Create Password" 
                    class="w-full bg-gray-100 border-none rounded-sm p-4 text-lg focus:ring-2 focus:ring-black outline-none transition"
                    required
                >
            </div>

            <button 
                type="button" 
                onclick="handleSignUp()"
                class="w-full bg-black text-white font-bold py-4 rounded-sm hover:bg-zinc-800 transition text-lg mt-4"
            >
                Create Account
            </button>
        </form>

        <div class="flex items-center my-8">
            <hr class="flex-grow border-gray-300">
            <span class="px-3 text-gray-500 text-sm">or</span>
            <hr class="flex-grow border-gray-300">
        </div>

        <div class="space-y-3">
            <button 
                type="button" 
                onclick="loginWithGoogle()" 
                class="w-full flex items-center justify-center border border-gray-300 py-3 rounded-sm hover:bg-gray-50 transition"
            >
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-3" alt="Google Logo">
                <span class="text-gray-700 font-medium">Sign up with Google</span>
            </button>
        </div>

        <p class="mt-8 text-sm text-gray-600">
            Already have an account? <a href="index.html" class="text-yellow-600 font-medium hover:underline">Log in</a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcTWF4JmmwXlFoY2T3A-rXX5dtNvVL4XI",
            authDomain: "velo-bytes-755e7.firebaseapp.com",
            projectId: "velo-bytes-755e7",
            storageBucket: "velo-bytes-755e7.firebasestorage.app",
            messagingSenderId: "810206566415",
            appId: "1:810206566415:web:1875ea3bb822baf6bcab7a",
            measurementId: "G-CYE3QV2EDD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // --- GOOGLE SIGN UP / LOGIN ---
        window.loginWithGoogle = async () => {
            try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            console.log("Account synced:", user.displayName);
            
            // Redirect to your dashboard or home page after signup
            alert(`Welcome to Velo Bytes, ${user.displayName}!`);
            window.location.href = "index.html"; 
            } catch (error) {
            console.error("Google Auth Error:", error.message);
            alert("Google Sign-up failed. Please try again.");
            }
        };

        // --- MANUAL EMAIL SIGN UP ---
        window.handleSignUp = async () => {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            try {
            await createUserWithEmailAndPassword(auth, email, password);
            alert("Account created successfully!");
            window.location.href = "index.html";
            } catch (error) {
            alert(error.message);
            }
        };
    </script>
</body>
</html>
